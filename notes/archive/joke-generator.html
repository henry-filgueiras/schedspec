<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Joke Generator</title>\n    <style>\n        body { font-family: Arial, sans-serif; text-align: center; }\n        #joke { margin: 20px; padding: 20px; border: 1px solid #ccc; }\n        #favorites { margin-top: 20px; }\n    </style>\n</head>\n<body>\n    <h1>Random Joke Generator</h1>\n    <button id="new-joke">Get a New Joke</button>\n    <div id="joke">Click the button to fetch a joke!</div>\n    <div id="rating">\n        <button data-rating="1">⭐ 1</button>\n        <button data-rating="2">⭐ 2</button>\n        <button data-rating="3">⭐ 3</button>\n        <button data-rating="4">⭐ 4</button>\n        <button data-rating="5">⭐ 5</button>\n    </div>\n    <div id="favorites"></div>\n\n    <script>\n        const jokeElement = document.getElementById('joke');\n        const newJokeButton = document.getElementById('new-joke');\n        const ratingButtons = document.querySelectorAll('#rating button');\n        const favoritesElement = document.getElementById('favorites');\n\n        const fetchJoke = async () => {\n            const response = await fetch('https://v2.jokeapi.dev/joke/Any');\n            const joke = await response.json();\n            if (joke.setup) {\n                jokeElement.innerHTML = `<strong>${joke.setup}</strong><br>${joke.delivery}`;\n            } else {\n                jokeElement.textContent = joke.joke;\n            }\n        };\n\n        newJokeButton.addEventListener('click', fetchJoke);\n\n        ratingButtons.forEach(button => {\n            button.addEventListener('click', () => {\n                const rating = button.dataset.rating;\n                const currentJoke = jokeElement.innerHTML;\n                const favorites = JSON.parse(localStorage.getItem('favorites')) || [];\n                favorites.push({ joke: currentJoke, rating });\n                localStorage.setItem('favorites', JSON.stringify(favorites));\n                displayFavorites();\n            });\n        });\n\n        const displayFavorites = () => {\n            const favorites = JSON.parse(localStorage.getItem('favorites')) || [];\n            favoritesElement.innerHTML = '<h2>Favorites</h2>' + favorites.map(fav => `<p>${fav.joke} - Rated: ${fav.rating} stars</p>`).join('');\n        };\n\n        window.onload = displayFavorites;\n    </script>\n</body>\n</html>
