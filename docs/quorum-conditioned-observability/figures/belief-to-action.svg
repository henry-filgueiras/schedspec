<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">From Belief to Action Under Partial Observability</title>
  <desc id="desc">A flow from local views to membership epoch and policy, through a threshold ceremony, to observable consequence and transcript.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf6; }
      .box { fill: #fffdf8; stroke: #232323; stroke-width: 2; rx: 12; ry: 12; }
      .text { font-family: Georgia, "Times New Roman", serif; fill: #232323; font-size: 20px; }
      .small { font-size: 15px; }
      .arrow { stroke: #232323; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .label { font-family: Georgia, "Times New Roman", serif; fill: #232323; font-size: 14px; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#232323"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="280"/>

  <text class="text" x="40" y="38">From Belief to Action Under Partial Observability</text>

  <rect class="box" x="40" y="90" width="180" height="96"/>
  <text class="text" x="84" y="125">Local Views</text>
  <text class="text small" x="67" y="150">partial membership</text>
  <text class="text small" x="84" y="170">and confidence</text>

  <rect class="box" x="260" y="90" width="220" height="96"/>
  <text class="text" x="293" y="125">Membership Epoch</text>
  <text class="text small" x="333" y="148">and Policy</text>
  <text class="text small" x="307" y="170">V_e, P_e, quorum rule</text>

  <rect class="box" x="520" y="90" width="190" height="96"/>
  <text class="text" x="545" y="125">Threshold</text>
  <text class="text" x="545" y="148">Ceremony</text>
  <text class="text small" x="549" y="170">plural contact</text>

  <rect class="box" x="750" y="70" width="170" height="54"/>
  <text class="text small" x="773" y="103">Observable Consequence</text>

  <rect class="box" x="750" y="144" width="170" height="54"/>
  <text class="text small" x="787" y="177">Transcript</text>

  <path class="arrow" d="M220 138 L260 138"/>
  <path class="arrow" d="M480 138 L520 138"/>
  <path class="arrow" d="M710 110 L750 97"/>
  <path class="arrow" d="M710 166 L750 171"/>

  <text class="label" x="346" y="216">belief becomes policy-shaped eligibility</text>
  <text class="label" x="553" y="236">capability crosses into the world only through quorum participation</text>
</svg>
