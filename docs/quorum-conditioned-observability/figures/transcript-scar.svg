<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">The Transcript Leaves a Durable Scar in the Log</title>
  <desc id="desc">A diagram showing a sealed artifact passing through a quorum ceremony and producing both an observable consequence and a transcript that records epoch, policy, participants, result, and residue for later audit.</desc>
  <defs>
    <style>
      .bg { fill: #f7f4ed; }
      .box { fill: #fffdfa; stroke: #2a2a2a; stroke-width: 2; rx: 16; ry: 16; }
      .ledger { fill: #f8fbfa; stroke: #4e8a72; stroke-width: 2; rx: 16; ry: 16; }
      .artifact { fill: #f5f1ff; stroke: #5f5b87; stroke-width: 2; rx: 16; ry: 16; }
      .warning { fill: #f7ead1; stroke: #b28736; stroke-width: 1.5; rx: 10; ry: 10; }
      .title { fill: #1f1f1f; font-family: Georgia, "Times New Roman", serif; font-size: 28px; }
      .subtitle { fill: #1f1f1f; font-family: Georgia, "Times New Roman", serif; font-size: 22px; }
      .text { fill: #1f1f1f; font-family: Georgia, "Times New Roman", serif; font-size: 18px; }
      .small { fill: #5f5850; font-family: Georgia, "Times New Roman", serif; font-size: 15px; }
      .mono { fill: #1f1f1f; font-family: "Courier New", monospace; font-size: 15px; }
      .arrow { stroke: #2a2a2a; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#2a2a2a"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="420"/>
  <text class="title" x="42" y="48">The Transcript Leaves a Durable Scar in the Log</text>
  <text class="small" x="42" y="78">The payload matters. The evidence that the payload crossed into the world through plural contact matters too.</text>

  <rect class="artifact" x="54" y="122" width="224" height="186"/>
  <text class="subtitle" x="82" y="162">Sealed Artifact A</text>
  <text class="text" x="88" y="204">latent capability</text>
  <text class="small" x="88" y="232">signature</text>
  <text class="small" x="88" y="254">decryption</text>
  <text class="small" x="88" y="276">release decision</text>

  <rect class="box" x="354" y="106" width="248" height="218"/>
  <text class="subtitle" x="384" y="146">Threshold Ceremony</text>
  <text class="text" x="386" y="188">epoch e</text>
  <text class="text" x="386" y="216">policy P<tspan baseline-shift="sub" font-size="12">e</tspan></text>
  <text class="text" x="386" y="244">eligible set Q</text>
  <text class="small" x="386" y="274">roles, domains, freshness, revocation</text>

  <rect class="box" x="678" y="122" width="192" height="84"/>
  <text class="subtitle" x="710" y="160">Observable Effect O</text>
  <text class="small" x="724" y="186">the world sees the result</text>

  <rect class="ledger" x="678" y="230" width="428" height="128"/>
  <text class="subtitle" x="706" y="264">Transcript X</text>
  <text class="mono" x="706" y="294">artifact_id: custody-decrypt/44</text>
  <text class="mono" x="706" y="318">epoch: 7   policy: fresh-3-of-5</text>
  <text class="mono" x="706" y="342">participants: beryl, drift, ember</text>

  <rect class="warning" x="910" y="278" width="170" height="28"/>
  <text class="small" x="926" y="297">residue: ember@6 excluded</text>

  <rect class="box" x="930" y="122" width="176" height="84"/>
  <text class="subtitle" x="966" y="160">Later Audit</text>
  <text class="small" x="954" y="186">why did the ceremony count?</text>

  <path class="arrow" d="M278 215 L354 215"/>
  <path class="arrow" d="M602 164 L678 164"/>
  <path class="arrow" d="M602 270 L678 294"/>
  <path class="arrow" d="M870 164 L930 164"/>
  <path class="arrow" d="M1060 230 L1060 206"/>
</svg>
