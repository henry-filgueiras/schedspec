[package]
name = "resonant-blockd"
description = "Federated blocklist daemon: consenting servers share moderation state with provenance, evidence-derived corroboration, and honest merge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "resonant-blockd"
path = "src/main.rs"

[dependencies]
resonant-kernel = { path = "../resonant-kernel" }
resonant-net = { path = "../resonant-net" }
clap = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "time"] }
libp2p = { version = "0.56", features = ["tokio"] }

[dev-dependencies]
futures = "0.3"
